name: lado-dev
version: 0.8.0
description: >-
  Develop LADO itself for the long term: a supervisor that designs with the human and
  delegates, an architect that reviews each design against the roadmap, developers that
  work test-first, and reviewers that check each branch before it is merged; what anyone
  finds outside the task goes to BACKLOG.md. The flows feature and fix take each task from
  design to merge.
dependencies:
  lado: ">=0.19"
  skills:
    superpowers: https://github.com/obra/superpowers@v6.4.1
    mattpocock-skills:
      from: https://github.com/mattpocock/skills@v1.2.3
      folders: [skills/engineering, skills/productivity]
    anthropic-plugins:
      from: https://github.com/anthropics/claude-plugins-official@ab024cdcfa7ca80be204acd4907656ba5a968589
      folders: [plugins/frontend-design/skills]
    designer-skills:
      from: https://github.com/Owl-Listener/designer-skills@9a6930cf84a822eb458624bd11c61aac5bbdf224
      folders: [interaction-design/skills, visual-critique/skills]
default_agent: developer
