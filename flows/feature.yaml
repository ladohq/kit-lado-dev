name: feature
description: >-
  A change to LADO from the human's intent to a merged branch: design with the human, an
  architect reviews the design, the human approves it, a developer implements it
  test-first, a reviewer checks it, the human approves the merge, the supervisor merges.
start: design
states:
  design:
    agent: supervisor
    needs: [design]
    do: |
      Design the change with the human, in the chat, for the long term (your role, section
      "Design for the long term").
      1. Restate what the human wants in two or three sentences. Done when the human agrees
         or corrects you.
      2. Look up facts yourself (code, docs, git history, BACKLOG.md). Use `grilling` to
         find the decisions that are the human's.
      3. Write a short design as your role says, with what changes and where, how it is
         tested, what is left out, and numbered acceptance criteria (AC-1, AC-2, ...), each
         a fact a reviewer can check from the diff or a command's output. Bugs and debt
         you found outside the task go in its last section, **Found on the way**
         (`lado-checks`): the developer records them.
      Ask the human's decisions, yours and the architect's "Questions for the human",
      before you write the design or revise it, in `grilling` rounds: numbered questions,
      each with its context and your recommended answer (the architect's, or yours if you
      disagree, with why). Send a round as one message to `human` (the summary names the
      round, the body holds the questions, one reply answers them), or as one `ask_human`
      per question when each has clear options (your recommendation first, the context in
      `details`). Write the answers into the design.
      On a later visit your previous design is the note from design (on the first visit
      there is no note yet): revise that text, not one from memory. The previous step's
      note holds the architect's findings or the human's answer. Address each finding in
      the design, or say in it why not, and copy the architect's **Found on the way** items
      into the design's section, so none is lost.
      Done when the design answers every open question. Report `ready` with the design's
      one-line summary in note_summary and in note_body the whole design, ACs included.
    outcomes: {ready: architecture}
  architecture:
    agent: architect
    max_visits: 3
    needs: [design, architecture]
    do: |
      Review the design (the note from design), read-only, as your role describes: against
      ROADMAP.md, AGENTS.md's Design principles, the code it touches and simpler
      alternatives.
      On a later visit, your previous review is the note from architecture: mark each of
      its findings RESOLVED or STILL OPEN first.
      Done when every point of your review has a verdict with its evidence. Report
      `approved` when no Critical or Important finding and no question for the human is
      left, otherwise `changes`; note_summary is the verdict and the counts; note_body is
      your review only, with the decisions that are the human's under "Questions for the
      human" (LADO gives the next steps the design itself).
    outcomes: {approved: design_ok, changes: design}
  design_ok:
    gate: approval
    needs: [design]
    ask: Approve the design?
    outcomes: {approved: implement, rejected: design}
  implement:
    agent: developer
    needs: [design, implement]
    do: |
      Implement the design (the note from design, as the human approved it) in the run's
      worktree, test-first, as your role describes. The architect's review comes with the
      human's answer in the previous step's note on the first visit; its Minor findings are
      advice: apply one only if it changes no AC or decision of the approved design, and
      list the ones you applied and skipped in your report. On a later visit your previous
      report is the note from implement, and the previous step's note says what to fix:
      review findings, a conflict with main (merge main into the run's branch and resolve
      it) or a red `make check`.
      Add a BACKLOG.md entry for each **Found on the way** item in the notes (the design's
      and the architect's) and for what you find yourself outside the task (`lado-checks`).
      After your last change run `make check`, or only `make lint` for a change only to
      non-code paths (`lado-checks`), and commit on the run's branch.
      Done when every AC about behaviour is covered by a test you saw fail and then pass,
      that check is green and the work is committed. Report `done`: note_summary is your
      status and a one-line result; note_body is your full report, and starts with every
      AC, written out in full, with its status and the test or command that shows it.
    outcomes: {done: review}
  review:
    agent: reviewer
    max_visits: 3
    needs: [design, review]
    do: |
      Review the run's branch against main, read-only, as your role describes: the diff is
      `git diff main...HEAD` in the run's worktree. The ACs are those of the approved design
      (the note from design); the developer's report in the previous step's note starts
      with its status for each. Check each AC of the design against the diff, not only the
      ones the report lists.
      Review the Architecture axis too, and list what is outside the change under
      **Found on the way**.
      On a later visit, your previous review is the note from review: mark each of its
      findings RESOLVED or STILL OPEN first.
      Done when every AC has a verdict and every finding its evidence. Report `approved`
      when the branch is ready to merge, otherwise `changes`; note_summary is the verdict
      and the finding count, note_body the full review.
    outcomes: {approved: merge_ok, changes: implement}
  merge_ok:
    gate: approval
    needs: [implement]
    ask: Merge?
    outcomes: {approved: merge, rejected: implement}
  merge:
    agent: supervisor
    do: |
      Merge the run's branch into main as `lado-checks`, section "Merging a run's branch",
      says; the review that approved it is in the note. Report `conflict` when
      `git merge main` conflicts, `red` when `make check` is red, and `merged` when main is
      at the run's branch with a green check; LADO then ends the run, closes its workers
      and removes its worktree and branch.
    outcomes: {merged: done, conflict: implement, red: implement}
  done:
    end: true
