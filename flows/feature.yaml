name: feature
description: >-
  A change to LADO from the human's intent to a merged branch: design with the human, the
  human approves it, a developer implements it test-first, a reviewer checks it, the human
  approves the merge, the supervisor merges.
start: design
states:
  design:
    agent: supervisor
    do: |
      Design the change with the human, in the chat.
      1. Restate what the human wants in two or three sentences. Done when the human agrees
         or corrects you.
      2. Look up facts yourself (code, docs, git history, BACKLOG.md). Use `grilling` to
         find the decisions that are the human's, and ask them as numbered questions, each
         with your recommended answer and why.
      3. Write a short design: what changes, where, how it is tested, what is left out, and
         numbered acceptance criteria (AC-1, AC-2, ...), each a fact a reviewer can check
         from the diff or a command's output.
      Done when the design answers every open question. Report `ready` with the design's
      one-line summary in note_summary and the whole design, ACs included, in note_body:
      the developer gets it as its brief, so it must stand alone.
    outcomes: {ready: design_ok}
  design_ok:
    gate: approval
    ask: Approve the design?
    outcomes: {approved: implement, rejected: design}
  implement:
    agent: developer
    do: |
      Implement the design from the note in the run's worktree, test-first, as your role
      describes. On a later visit the note says what to fix: review findings, a conflict
      with main (merge main into the run's branch and resolve it) or a red `make check`.
      Run `make check` after your last change and commit on the run's branch.
      Done when every AC about behaviour is covered by a test you saw fail and then pass,
      `make check` is green and the work is committed. Report `done`: note_summary is your
      status and a one-line result; note_body is your full report, and starts with every
      AC, written out in full, with its status and the test or command that shows it.
    outcomes: {done: review}
  review:
    agent: reviewer
    max_visits: 3
    do: |
      Review the run's branch against main, read-only, as your role describes: the diff is
      `git diff main...HEAD` in the run's worktree. The ACs, with the developer's status for
      each, start the developer's report in the note; check each against the diff.
      On a second visit, mark each previous finding RESOLVED or STILL OPEN first.
      Done when every AC has a verdict and every finding its evidence. Report `approved`
      when the branch is ready to merge, otherwise `changes`; note_summary is the verdict
      and the finding count, note_body the full review.
    outcomes: {approved: merge_ok, changes: implement}
  merge_ok:
    gate: approval
    ask: Merge?
    outcomes: {approved: merge, rejected: implement}
  merge:
    agent: supervisor
    do: |
      Check the branch together with the current main before main moves:
      1. In the run's worktree, `git merge main`. If it conflicts, `git merge --abort` and
         report `conflict`, with the conflicting files in the note.
      2. Run `make check` in the run's worktree. If it is red, report `red`, with the
         failing output in the note.
      3. In your repo, on main, `git merge --ff-only <the run's branch>`. If main moved in
         the meantime and that fails, start again at 1.
      Done when main is at the run's branch and `make check` on it is green. Report
      `merged`; LADO then ends the run, closes its workers and removes its worktree and
      branch.
    outcomes: {merged: done, conflict: implement, red: implement}
  done:
    end: true
