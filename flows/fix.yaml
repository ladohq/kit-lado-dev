name: fix
description: >-
  A small, clearly scoped change to LADO (a bug fix, a doc fix, a review follow-up) whose
  task already states its acceptance criteria: a developer implements it, a reviewer checks
  it, the human approves the merge, the supervisor merges. No design step.
start: implement
states:
  implement:
    agent: developer
    needs: [implement]
    do: |
      Implement the task in the run's worktree, test-first, as your role describes. On a
      later visit your previous report is the note from implement, and the previous step's
      note says what to fix: review findings, a conflict with main (merge main into the
      run's branch and resolve it), a red check of the merge step, or the human's reason for
      rejecting the merge (quote it at the top of your report).
      Done when every AC about behaviour is covered by a test you saw fail and then pass,
      each **Found on the way** item has its BACKLOG.md entry (your role, section 4), the
      checks `lado-checks` names for your change are green and the work is committed on the
      run's branch. Report `done`: note_summary is your status and a one-line result;
      note_body is your full report (your role, section 5), and starts with every AC, written out in full, with its status
      and the test or command that shows it.
    outcomes: {done: review}
  review:
    agent: reviewer
    max_visits: 3
    needs: [review]
    do: |
      Review the run's branch against main, read-only, as your role describes: the diff is
      `git diff main...HEAD` in the run's worktree. The ACs are in the task; the developer's
      report in the previous step's note starts with its status for each. Check each
      against the diff, and a quoted rejection of the merge like an AC.
      On a later visit, your previous review is the note from review: mark each of its
      findings RESOLVED or STILL OPEN first.
      Done when every AC has a verdict and every finding its evidence. Report `approved`
      for "Ready to merge: Yes", otherwise `changes`, as your role, section 4, says.
    outcomes: {approved: merge_ok, changes: implement}
  merge_ok:
    gate: approval
    needs: [implement]
    ask: Merge?
    outcomes: {approved: merge, rejected: implement}
  merge:
    agent: supervisor
    do: |
      Follow `lado-checks`, "Merging a run's branch".
    outcomes: {merged: done, conflict: implement, red: implement}
  done:
    end: true
