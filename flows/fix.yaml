name: fix
description: >-
  A small, clearly scoped change to LADO (a bug fix, a doc fix, a review follow-up) whose
  task already states its acceptance criteria: a developer implements it, a reviewer checks
  it, the human approves the merge, the supervisor merges. No design step.
start: implement
states:
  implement:
    agent: developer
    do: |
      Implement the task in the run's worktree, test-first, as your role describes. On a
      later visit the note says what to fix: review findings, a conflict with main (merge
      main into the run's branch and resolve it) or a red `make check`.
      Add a BACKLOG.md entry for each **Found on the way** item in the note and for what
      you find yourself outside the task (`lado-checks`).
      Run `make check` after your last change and commit on the run's branch.
      Done when every AC about behaviour is covered by a test you saw fail and then pass,
      `make check` is green and the work is committed. Report `done`: note_summary is your
      status and a one-line result; note_body is your full report, and starts with every
      AC, written out in full, with its status and the test or command that shows it.
    outcomes: {done: review}
  review:
    agent: reviewer
    max_visits: 3
    needs: [review]
    do: |
      Review the run's branch against main, read-only, as your role describes: the diff is
      `git diff main...HEAD` in the run's worktree. The ACs are in the task; the developer's
      report in the previous step's note starts with its status for each. Check each
      against the diff.
      Review the Architecture axis too, and list what is outside the change under
      **Found on the way**.
      On a later visit, your previous review is the note from review: mark each of its
      findings RESOLVED or STILL OPEN first.
      Done when every AC has a verdict and every finding its evidence. Report `approved`
      when the branch is ready to merge, otherwise `changes`; note_summary is the verdict
      and the finding count, note_body the full review.
    outcomes: {approved: merge_ok, changes: implement}
  merge_ok:
    gate: approval
    ask: Merge?
    outcomes: {approved: merge, rejected: implement}
  merge:
    agent: supervisor
    do: |
      Record what the review found on the way, then check the branch together with the
      current main before main moves:
      1. For each **Found on the way** item in the review in the note, add a BACKLOG.md
         entry (`lado-checks`) in the run's worktree and commit it on the run's branch.
      2. In the run's worktree, note `git rev-parse HEAD`, then `git merge main`. If it
         conflicts, `git merge --abort` and report `conflict`, with the conflicting files
         in the note.
      3. Skip `make check` only when both hold (`lado-checks`, "Run as little as proves
         the claim"): `git rev-parse HEAD` is the same as before the merge (it brought
         nothing; "Already up to date" is only a hint), and the review in the note names
         the commit its green `make check` ran on and `git log --name-only <that
         commit>..HEAD` shows only non-code paths (such as your BACKLOG.md commit). Then
         say in the note which commit's check stands. Otherwise run
         `make check > <log file> 2>&1` in the run's worktree, with the log outside the
         tree, and take its exit status; then show the log's last lines. Never pipe
         `make check` (`| tail` hides a red exit status). If it is red, report `red`, with
         the failing output in the note.
      4. In your repo, on main, `git merge --ff-only <the run's branch>`. If main moved in
         the meantime and that fails, start again at 2.
      Done when each item found on the way has its entry, main is at the run's branch and
      the code that lands has a green `make check`: yours, or the reviewer's when step 3
      let you skip it. Report
      `merged`; LADO then ends the run, closes its workers and removes its worktree and
      branch.
    outcomes: {merged: done, conflict: implement, red: implement}
  done:
    end: true
