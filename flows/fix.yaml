name: fix
description: >-
  A small, clearly scoped change to LADO (a bug fix, a doc fix, a review follow-up) whose
  task already states its acceptance criteria: a developer implements it, a reviewer checks
  it, the human approves the merge, the supervisor merges. No design step.
start: implement
states:
  implement:
    agent: developer
    needs: [implement]
    do: |
      Implement the task in the run's worktree, test-first, as your role describes. On a
      later visit your previous report is the note from implement, and the previous step's
      note says what to fix: review findings, a conflict with main (merge main into the
      run's branch and resolve it) or a red `make check`.
      Add a BACKLOG.md entry for each **Found on the way** item in the note and for what
      you find yourself outside the task (`lado-checks`).
      After your last change run `make check`, or only `make lint` for a change only to
      non-code paths (`lado-checks`), and commit on the run's branch.
      Done when every AC about behaviour is covered by a test you saw fail and then pass,
      that check is green and the work is committed. Report `done`: note_summary is your
      status and a one-line result; note_body is your full report, and starts with every
      AC, written out in full, with its status and the test or command that shows it.
    outcomes: {done: review}
  review:
    agent: reviewer
    max_visits: 3
    needs: [review]
    do: |
      Review the run's branch against main, read-only, as your role describes: the diff is
      `git diff main...HEAD` in the run's worktree. The ACs are in the task; the developer's
      report in the previous step's note starts with its status for each. Check each
      against the diff.
      Review the Architecture axis too, and list what is outside the change under
      **Found on the way**.
      On a later visit, your previous review is the note from review: mark each of its
      findings RESOLVED or STILL OPEN first.
      Done when every AC has a verdict and every finding its evidence. Report `approved`
      when the branch is ready to merge, otherwise `changes`; note_summary is the verdict
      and the finding count, note_body the full review.
    outcomes: {approved: merge_ok, changes: implement}
  merge_ok:
    gate: approval
    needs: [implement]
    ask: Merge?
    outcomes: {approved: merge, rejected: implement}
  merge:
    agent: supervisor
    do: |
      Follow `lado-checks`, section "Merging a run's branch", with the approving review in
      the note: record its **Found on the way** items, merge main in, check, fast-forward
      main. Done when main is at the run's branch with a green check: report `merged`, and
      LADO ends the run. Report `conflict` if merging main conflicts, `red` if `make check`
      is red.
    outcomes: {merged: done, conflict: implement, red: implement}
  done:
    end: true
